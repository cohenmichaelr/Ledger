# Render Blueprint: https://render.com/docs/blueprint-spec
# Render builds natively with uv (it detects uv.lock) and reads .python-version.
services:
  - type: web
    name: ledger
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit  # every push to main redeploys
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn ledger.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Neon Postgres connection string. sync: false = a secret you enter in the Render
      # dashboard (Environment tab); it is never committed. Unset -> SQLite (wiped on deploy).
      - key: LEDGER_DATABASE_URL
        sync: false
      # Tiingo API key for end-of-day prices. Also a secret entered in the Render dashboard.
      - key: LEDGER_TIINGO_API_KEY
        sync: false
